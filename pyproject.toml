[project]
name = "figure-gate"
version = "0.2.0"
description = "Mechanical gates for publication figures: colorblind-safe color, composition, and type legibility at print size."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naren Prakash", email = "146764727+narenp12@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = ["matplotlib", "figures", "accessibility", "colorblind",
            "okabe-ito", "viridis", "data-visualization", "publishing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

# The checkers are designed to be copied into a project, not depended on -- that
# is why check_palette.py imports nothing outside the standard library. The
# install path exists for people who would rather pin a version than vendor a
# file; it changes nothing about how the scripts work.
dependencies = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/narenp12/figure-gate"
Documentation = "https://narenp12.github.io/figure-gate/"
Source = "https://github.com/narenp12/figure-gate"
Issues = "https://github.com/narenp12/figure-gate/issues"
Changelog = "https://github.com/narenp12/figure-gate/blob/main/CHANGELOG.md"

[project.scripts]
check-palette = "check_palette:main"
check-figure = "check_figure:main"

# scipy is optional and only ever a speed-up: `check_overplotting` uses a KD-tree
# when it is importable and an O(n^2) numpy path when it is not. The README
# promises three files and no install, and a hard scipy import broke that.
[project.optional-dependencies]
fast = ["scipy>=1.6"]

# The floor does real work here, it is not hygiene: `license = "MIT"` and `license-files`
# are PEP 639, and hatchling only emits them as Metadata-Version 2.4 from 1.26.
# An unpinned older backend would silently build a package whose licence PyPI
# cannot read.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["skill/scripts"]
sources = ["skill/scripts"]

# The sheet ships beside the scripts, which is the first location `_style_sheet`
# probes. Without it the style-sheet gate cannot fire on the install path: no
# sheet is found, so the row reads "nothing to compare" and a figure drawn on
# stock matplotlib -- the forgotten `plt.style.use` the gate exists to catch --
# passes it.
[tool.hatch.build.targets.wheel.force-include]
"skill/assets/figure.mplstyle" = "figure.mplstyle"

# Keeps the skill, the tests and the examples -- the tests are what make the
# thresholds checkable by someone who did not write them. Drops agent scratch
# state, which means nothing outside this checkout.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.codebase-memory",
    "/.github",
    "/CLAUDE.md",
    "/opencode.json",
    ".DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # A missing font family is a real defect in a figure, but in CI the runner
    # simply has no serif installed and the fallback is correct behaviour.
    "ignore:findfont:UserWarning",
]

# A group, not an extra: extras are published metadata, and a `figure-gate[dev]`
# on the project page means nothing to anyone installing a checker.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.8.0",
    "scipy>=1.6",
]

# Separate from dev: the docs build needs nothing the tests need and the tests
# need nothing it needs, so `uv sync --group dev` on a test runner should not
# pull a theme.
#
# Pinned to a minor, not floored: Zensical is 0.0.x, so the usual reading of a
# lower bound -- "anything newer is compatible" -- does not hold.
#
# The marker is load-bearing, not hygiene. Zensical needs Python 3.10; this
# project supports 3.9, and `check_palette.py` supports 3.8, which is a claim
# CI runs a whole job to keep true. Without the marker uv resolves this group
# across the project's full Python range and fails outright -- and the tempting
# fix, raising `requires-python`, would narrow the library's support because of
# a tool that only builds a website.
docs = ["zensical>=0.0.51,<0.1; python_version >= '3.10'"]

# Out of `dev` on purpose: the documented command is
# `uv run rtk pytest tests/ -n auto -q`, and running the figure gates should not
# start requiring a 150MB Chromium. Without this group `test_docs_render.py`
# still collects -- so the README's test count is the same number on every
# machine -- and skips at run time. CI installs it in the docs job.
#
# Same marker as `docs`, and for the same reason.
docs-test = [
    "filelock>=3.12 ; python_full_version >= '3.10'",
    "playwright>=1.40 ; python_full_version >= '3.10'",
]
