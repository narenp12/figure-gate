[project]
name = "figure-gate"
version = "0.5.0"
description = "Mechanical gates for publication figures: colorblind-safe color, composition, and type legibility at print size."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naren Prakash", email = "146764727+narenp12@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["matplotlib", "figures", "accessibility", "colorblind",
            "okabe-ito", "viridis", "data-visualization", "publishing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

# The checkers are designed to be copied into a project, not depended on -- that
# is why check_palette.py imports nothing outside the standard library. The
# install path exists for people who would rather pin a version than vendor a
# file; it changes nothing about how the scripts work.
dependencies = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/narenp12/figure-gate"
Documentation = "https://narenp12.github.io/figure-gate/"
Source = "https://github.com/narenp12/figure-gate"
Issues = "https://github.com/narenp12/figure-gate/issues"
Changelog = "https://github.com/narenp12/figure-gate/blob/main/CHANGELOG.md"

[project.scripts]
check-palette = "check_palette:main"
check-figure = "check_figure:main"

# scipy is optional and only ever a speed-up: `check_overplotting` uses a KD-tree
# when it is importable and an O(n^2) numpy path when it is not. The README
# promises three files and no install, and a hard scipy import broke that.
[project.optional-dependencies]
fast = ["scipy>=1.6"]

# The floor does real work here, it is not hygiene: `license = "MIT"` and `license-files`
# are PEP 639, and hatchling only emits them as Metadata-Version 2.4 from 1.26.
# An unpinned older backend would silently build a package whose licence PyPI
# cannot read.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["skill/scripts"]
sources = ["skill/scripts"]

# The sheet ships beside the scripts, which is the first location `_style_sheet`
# probes. Without it the style-sheet gate cannot fire on the install path: no
# sheet is found, so the row reads "nothing to compare" and a figure drawn on
# stock matplotlib -- the forgotten `plt.style.use` the gate exists to catch --
# passes it.
[tool.hatch.build.targets.wheel.force-include]
"skill/assets/figure.mplstyle" = "figure.mplstyle"

# Keeps the skill, the tests and the examples -- the tests are what make the
# thresholds checkable by someone who did not write them. Drops agent scratch
# state, which means nothing outside this checkout.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.codebase-memory",
    "/.github",
    "/CLAUDE.md",
    "/opencode.json",
    ".DS_Store",
]

[tool.ruff]
# The project floor, which is what everything except one file is written to.
target-version = "py311"

# The exception, and the reason ruff is configured at all. `check_palette.py` is
# claimed to run on Python 3.8 with nothing installed, and that claim is what
# makes it vendorable into a non-Python toolchain. The `stdlib-only` job in
# ci.yml already runs it on 3.8, so a syntax break is caught -- but only after a
# push, and only for the two invocations that job happens to make. Ruff reads
# the whole file against the 3.8 grammar in the editor, before the commit.
#
# Per-file rather than a nested config: `check_figure.py` sits in the same
# directory, imports matplotlib, and is under no such constraint.
per-file-target-version = { "skill/scripts/check_palette.py" = "py38" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "FA"]

# E741 forbids `l` as a name. In OKLab, `l` IS the name of the lightness
# channel: `linear_to_oklab` returns `l, m, s` because that is what the
# published matrix calls its rows. Renaming to satisfy the linter would make
# the code harder to check against the reference, not easier.
#
# B905 wants `strict=` on every `zip()`. It is a 3.10 keyword, so it cannot be
# used in the file with the 3.8 floor, and adding it everywhere else buys a
# guard against a length mismatch that no zip here can have.
ignore = ["E741", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["conda", "examples", "skill", "tests"]

# The code is unannotated by choice, so the strict flags are off: the value here
# is catching a real contradiction (an attribute that cannot exist, a return
# that cannot happen), not pressure to annotate. matplotlib and scipy ship
# incomplete stubs and pytest plugins ship none, and nothing is gained by
# reporting that.
ignore_missing_imports = true

# Third-party types are not read at all, which is a larger hammer than it looks
# and is here for a specific reason. numpy's `__init__.pyi` uses PEP 695 `type`
# statements, and mypy refuses to parse those when `python_version` is below
# 3.12: it stops at the first one and reports "errors prevented further
# checking", so the run says nothing about this project's code at all. CI builds
# its venv on 3.13 and hit exactly that; a 3.11 venv happens to resolve an older
# numpy and did not, which is why this passed locally and failed on the first
# push.
#
# The alternative was raising `python_version` to 3.13, which would have made
# the stub parse and quietly stopped checking this code against the 3.11 floor
# it actually has to run on. Given `ignore_missing_imports` was already set, the
# gate was never leaning on matplotlib's or numpy's types; it is here for
# contradictions in this project's own code, and it still catches those. Drop
# this line once the floor reaches 3.12.
no_site_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # A missing font family is a real defect in a figure, but in CI the runner
    # simply has no serif installed and the fallback is correct behaviour.
    "ignore:findfont:UserWarning",
    # cmasher 1.9.2 builds each of its 114 colormaps with
    # `ListedColormap(..., N=...)`, deprecated in matplotlib 3.11 and removed
    # in 3.13, so importing the oracle emits 114 identical warnings. Ours is
    # not the code being warned about: nothing under `skill/scripts/` builds a
    # ListedColormap at all, so this cannot mask a defect of this project's.
    #
    # It is a countdown, not a fix. On matplotlib 3.13 cmasher stops importing
    # outright; `oracle()` in tests/test_palette_oracle.py skips with the
    # ImportError attached when that happens, so the suite stays green and says
    # what it stopped checking. Drop this line once cmasher ships the fix.
    "ignore:Passing 'N' to ListedColormap is deprecated:DeprecationWarning",
]

# cmasher is a TEST ORACLE and never a runtime dependency. `cmap_kind` is a
# port of its `get_cmap_type()` into OKLab, and `tests/test_palette_oracle.py`
# differentials the two across matplotlib's registry. It earned its place
# before it was written into a test: running the differential during design
# caught a wrong threshold that would otherwise have shipped 11 colormaps in
# the wrong family.
#
# cmasher pulls colorspacious, numpy and matplotlib, none of which the shipped
# scripts may import. It needed a `python_full_version >= '3.10'` marker while
# this project supported 3.9; the floor is 3.11 now, so the marker is gone and
# the oracle runs everywhere the tests do.
[dependency-groups]
dev = [
    "cmasher>=1.9",
    "mypy>=1.11",
    "pytest>=7.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
    "scipy>=1.6",
]

# Separate from dev: the docs build needs nothing the tests need and the tests
# need nothing it needs, so `uv sync --group dev` on a test runner should not
# pull a theme.
#
# Pinned to a minor, not floored: Zensical is 0.0.x, so the usual reading of a
# lower bound -- "anything newer is compatible" -- does not hold.
#
# The marker outlived its reason and is kept anyway. It was load-bearing while
# `requires-python` was 3.9: Zensical needs 3.10, so without it uv resolved the
# group across the project's full range and failed outright. The floor is 3.11
# now, so it never excludes anything -- but `check_palette.py` is still claimed
# to run on 3.8 when vendored, and a marker that documents a tool's own floor
# costs nothing next to a resolution failure if that range ever widens again.
docs = ["zensical>=0.0.51,<0.1; python_version >= '3.10'"]

# Out of `dev` on purpose: the documented command is
# `uv run rtk pytest tests/ -n auto -q`, and running the figure gates should not
# start requiring a 150MB Chromium. Without this group `test_docs_render.py`
# still collects -- so the README's test count is the same number on every
# machine -- and skips at run time. CI installs it in the docs job.
#
# Same marker as `docs`, and for the same reason.
docs-test = [
    "filelock>=3.12 ; python_full_version >= '3.10'",
    "playwright>=1.40 ; python_full_version >= '3.10'",
]
