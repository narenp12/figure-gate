[project]
name = "figure-gate"
version = "0.9.0.dev0"
description = "Mechanical gates for publication figures: colorblind-safe color, composition, and type legibility at print size."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naren Prakash", email = "146764727+narenp12@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["matplotlib", "figures", "accessibility", "colorblind",
            "okabe-ito", "viridis", "data-visualization", "publishing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

# The checkers are designed to be copied into a project, not depended on -- that
# is why check_palette.py imports nothing outside the standard library. The
# install path exists for people who would rather pin a version than vendor a
# file; it changes nothing about how the scripts work.
dependencies = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/narenp12/figure-gate"
Documentation = "https://narenp12.github.io/figure-gate/"
Source = "https://github.com/narenp12/figure-gate"
Issues = "https://github.com/narenp12/figure-gate/issues"
Changelog = "https://github.com/narenp12/figure-gate/blob/main/CHANGELOG.md"

[project.scripts]
check-palette = "figure_gate.check_palette:main"
check-figure = "figure_gate.check_figure:main"

# scipy is optional and only ever a speed-up: `check_overplotting` uses a KD-tree
# when it is importable and an O(n^2) numpy path when it is not. The docs
# promise three files and no install, and a hard scipy import broke that.
[project.optional-dependencies]
fast = ["scipy>=1.6"]

# The floor does real work here, it is not hygiene: `license = "MIT"` and `license-files`
# are PEP 639, and hatchling only emits them as Metadata-Version 2.4 from 1.26.
# An unpinned older backend would silently build a package whose licence PyPI
# cannot read.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# `skill/scripts/` becomes the `figure_gate` package, rather than being emptied
# onto the top level of `site-packages`.
#
# Until 0.7.0 `sources = ["skill/scripts"]` stripped the prefix and installed
# `check_figure.py`, `check_palette.py` and `suggest_fixes.py` as top-level
# modules: three of the most generic names a distribution could claim, sitting
# next to `matplotlib` and `numpy`, and permanent the moment callers import
# them. A distribution called figure-gate now installs something called
# `figure_gate`.
#
# It also unblocks PEP 561. `py.typed` only carries types for a package, so
# every annotation in these files -- all of them, as of the previous release --
# resolved to `Any` in a caller's type checker for as long as the layout was
# flat.
#
# The vendored form is untouched: the files stay where they are in the
# repository, still import nothing of each other at module scope, and are still
# copied one at a time. Only the install path moves.
[tool.hatch.build.targets.wheel]
only-include = ["skill/scripts"]
sources = { "skill/scripts" = "figure_gate" }
# Release tooling, not something a caller imports. It reaches the checkout
# through the `audit-api` target in the Makefile and through its own test, and
# shipping it put a script nobody installs for on every user's import path.
exclude = ["skill/scripts/audit_api.py"]

# The sheet ships inside the wheel, which is the first location `_style_sheet`
# probes. Without it the style-sheet gate cannot fire on the install path: no
# sheet is found, so the row reads "nothing to compare" and a figure drawn on
# stock matplotlib -- the forgotten `plt.style.use` the gate exists to catch --
# passes it.
#
# It sits inside the package, beside the module that reads it. It used to sit
# in a `figure_gate_data/` directory at the wheel root, and that directory only
# ever existed because the modules were at the wheel root too: a bare
# `figure.mplstyle` dropped straight into `site-packages` is a generic name any
# other distribution could also claim. Inside `figure_gate/` that cannot
# happen, so the namespacing directory has no work left to do and is gone.
#
# The filename does not change: `tests/test_prose_claims.py` resolves
# `figure.mplstyle` against the tracked `skill/assets/figure.mplstyle`, and a
# name that exists only inside a built wheel resolves to nothing.
[tool.hatch.build.targets.wheel.force-include]
"skill/assets/figure.mplstyle" = "figure_gate/figure.mplstyle"

# Keeps the skill, the tests and the examples -- the tests are what make the
# thresholds checkable by someone who did not write them.
#
# An allowlist, and it used to be a blacklist of agent-scratch paths. The
# blacklist shipped: it named `/.claude` and `/.codebase-memory` but not
# `.superpowers/`, which is neither tracked nor gitignored, so twelve files of
# task briefs and review diffs went into the sdist along with whatever stray
# untracked note was in the tree at build time. Releases come off a fresh
# `actions/checkout` and so were never affected, but `make dist` on a working
# machine was, and a blacklist only excludes the scratch directory whose name
# somebody remembered.
#
# Listing what a source release IS cannot fail that way: a new directory is
# absent until it is named, rather than present until it is excluded.
[tool.hatch.build.targets.sdist]
include = [
    "/skill",
    "/tests",
    "/examples",
    "/docs",
    "/specs",
    "/conda",
    "/.claude-plugin",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/zensical.toml",
    "/.gitignore",
]
exclude = [".DS_Store"]

# The version is written in five files and a tag, and nothing wrote them
# together. 0.5.0 is what that costs: the bump moved pyproject.toml and
# plugin.json, and all three pytest jobs failed on the release PR because
# conda/recipe.yaml still said 0.4.0.
#
# The checks that caught it stay -- tests/test_conda_recipe.py and the
# plugin.json step in ci.yml. What changes is their job. They stop being the
# only thing between a half-finished bump and a release, and become the proof
# that one command ran.
#
#     uv run bump-my-version bump dev
#
# rewrites all five, commits, and tags v<new>. Pushing the tag is still what
# publishes; release.yml has not moved.
#
# `dev` rather than `minor`, because the version between releases now carries a
# `.devN` suffix -- see the `parse`/`serialize` block below for why. Cutting a
# release drops the suffix; `bump minor` (or `patch`, or `major`) is what opens
# the next development cycle afterwards. The release bump rewrites five files;
# the cycle-opening bump rewrites four, for the reason under `exclude_bumps`
# below.
#
# Three things it deliberately does not do. `sha256` in the recipe is unknowable
# until the sdist exists on PyPI, which is what conda/update_recipe.py is for.
# The recipe's `source.url` interpolates the version, so between releases it
# names a `.dev0` sdist that PyPI does not have; nothing builds from the
# in-repo recipe -- the conda-forge feedstock has its own -- and the URL is
# correct again the moment `bump dev` runs.
# And nothing writes a fresh `## Unreleased` stub back into the changelog: the
# CHANGELOG entry below fails the release bump outright when there is no such
# heading, so a release with no notes stops here rather than at the
# `no '## $version' section` check in release.yml, after the tag is already
# pushed. Writing the heading is the first step of writing the notes.
#
# The entries below are in write order, and CHANGELOG.md is first for that
# reason. bump-my-version writes each file as it reaches it rather than
# validating the set up front: with the changelog last, a missing
# `## Unreleased` leaves the other three bumped on disk before it errors. It
# stops short of the commit and the tag either way, so `git checkout .` is the
# whole recovery, but a failure that touches nothing is a failure nobody has to
# read a diff to trust.
[tool.bumpversion]
current_version = "0.9.0.dev0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "figure-gate {new_version}"

# The version between releases says it is between releases.
#
# It did not until now: the tree carried the version of the release that had
# already happened, so a checkout ahead of v0.6.0 still said `0.6.0` and
# `uv build` on it produced `figure_gate-0.6.0-py3-none-any.whl` -- a file
# named exactly like the 0.6.0 on PyPI and not the same code. Releases build
# from a tag on a fresh checkout and were never affected; `make dist` on a
# working machine was, and the artifact carries no hint of it.
#
# So the development version is `X.Y.Z.devN` and the last step before tagging
# drops the suffix:
#
#     uv run bump-my-version bump dev       # 0.7.0.dev0 -> 0.7.0
#
# `bump minor` from a released version opens the next dev cycle (0.7.0 ->
# 0.8.0.dev0), so the two-command release is `bump dev` to cut, and `bump
# minor`/`bump patch` to open the next one. `dev` is `optional_value`, which is
# what makes `{major}.{minor}.{patch}` the serialization once the part is empty
# rather than leaving a trailing separator.
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:\\.dev(?P<dev>0|[1-9]\\d*))?
"""
serialize = [
    "{major}.{minor}.{patch}.dev{dev}",
    "{major}.{minor}.{patch}",
]

# The stock message is `Bump version: 0.5.0 → 0.6.0`. This one reads like the
# release commits already in the log, and drops the arrow.
#
# It has to sit on `[tool.bumpversion]` itself. Written under
# `[tool.bumpversion.parts.dev]`, which is where it was through 0.6.0, it is a
# key on a part rather than on the config: bump-my-version reads no `message`
# there, says nothing about the one it found, and commits the stock text. Both
# releases cut with this config carried it.
message = "chore: release {new_version}"

[tool.bumpversion.parts.dev]
optional_value = "None"
values = ["0", "None"]

# The heading release.yml cuts the GitHub release notes out of, and the entry
# that fails a release with no notes. The date format matches every heading
# already in the file: the awk in that workflow matches on `## ` and the
# version field alone, but a heading that reads differently from its neighbours
# is a diff someone has to stop and think about.
#
# Anchored to a line of its own, because the changelog writes about its own
# headings. `## Unreleased` unanchored replaced every mention of the string,
# including the ones inside sentences, and 0.6.0 shipped with two: the notes
# explaining the gate that requires an Unreleased section came out saying a
# missing `## 0.6.0 — 2026-07-30` heading, which is not a thing that gate has
# ever asked for. The heading is the only occurrence that starts a line.
#
# `exclude_bumps` is what makes the two-command release run at all. The entry
# above applies to every bump, and the cycle-opening one comes straight after a
# release, when the heading it wants was consumed by that release and the next
# one has not been written. So `bump minor` failed with `Did not find
# '^## Unreleased$'`, which is why 0.7.0 left the tree reading `0.7.0` instead
# of `0.8.0.dev0` and why 0.8.0 had to be cut with an explicit `--new-version`.
#
# Naming the three cycle-opening parts here, rather than including `dev` alone,
# keeps the failure for anything unlisted: a part added later is one nobody has
# thought about, and the loud version of that is the bump refusing to run.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
regex = true
search = "^## Unreleased$"
replace = "## {new_version} — {now:%Y-%m-%d}"
exclude_bumps = ["major", "minor", "patch"]

# Anchored for a different reason. `current_version` above ends in
# `version = "0.5.0"`, so an unanchored search rewrites that line as well --
# harmlessly today, since it wants the same new value and bump-my-version
# maintains it anyway, but it is a second write to a line the tool owns.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'

# Claude Code pins plugin installs to this string, so a release that skipped it
# would ship new files under the old version and no installed copy would update.
[[tool.bumpversion.files]]
filename = "skill/.claude-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# Two leading spaces: this is the `context:` entry rattler-build interpolates
# into `source.url`, not the `package.version` line that reads `${{ version }}`.
[[tool.bumpversion.files]]
filename = "conda/recipe.yaml"
search = '  version: "{current_version}"'
replace = '  version: "{new_version}"'

# The fifth site, and the one that was missed for four releases: uv.lock records
# the project's own version and nothing wrote it, so it still read 0.7.0 after
# 0.8.0 shipped.
#
# The cost is not a stale number in a file nobody reads. `uv run` without
# `--no-sync` rewrites the line to match pyproject.toml, so the tree goes dirty
# on its own, and bump-my-version refuses to start on an unclean tree. The
# version site nobody was maintaining was blocking the command that maintains
# the version sites.
#
# Anchored across two lines, because uv.lock holds a `version = ` line for every
# package in the graph and the project's own is identified only by the `name`
# above it. An unanchored search would rewrite whichever package sorted first
# with a matching version, and that is not hypothetical: the lock currently
# carries annotated-types 0.8.0, ast-serialize 0.6.0 and mdurl 0.1.2, all
# versions this project has shipped. uv.lock is sorted by name, so cutting 0.8.0
# unanchored would have found annotated-types before figure-gate and pinned a
# dependency to a version that does not exist.
[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = 'name = "figure-gate"\nversion = "{current_version}"'
replace = 'name = "figure-gate"\nversion = "{new_version}"'

[tool.uv]
package = false

[tool.ruff]
# The project floor, which is what everything except one file is written to.
target-version = "py311"

# The exception, and the reason ruff is configured at all. `check_palette.py` is
# claimed to run on Python 3.8 with nothing installed, and that claim is what
# makes it vendorable into a non-Python toolchain. The `stdlib-only` job in
# ci.yml already runs it on 3.8, so a syntax break is caught -- but only after a
# push, and only for the two invocations that job happens to make. Ruff reads
# the whole file against the 3.8 grammar in the editor, before the commit.
#
# Per-file rather than a nested config: `check_figure.py` sits in the same
# directory, imports matplotlib, and is under no such constraint.
per-file-target-version = { "skill/scripts/check_palette.py" = "py38" }

[tool.ruff.lint]
# The four `DOC` rules are the docstring half of what `test_prose_claims.py`
# does to the markdown: a docstring that names a parameter the signature does
# not have, or documents a return, a yield or an exception the body never
# produces, is prose making a claim the code does not honour. Same defect class,
# a surface no sweep over `*.md` reaches.
#
# Only the four `extraneous` rules. Their `missing` counterparts -- DOC201 alone
# reports 59 -- ask every function to carry a Returns section, which is a house
# style this project does not write in and would not be improved by. Missing
# prose is an editorial decision; prose that contradicts the code is a defect.
#
# Both settings are load-bearing. `preview` because the pydoclint rules are not
# stable yet, and `explicit-preview-rules` so that turning them on selects those
# four codes and nothing else: without it, `preview` also changes the behaviour
# of every stable rule already in `select`.
select = ["E4", "E7", "E9", "F", "B", "UP", "FA",
          "DOC102", "DOC202", "DOC403", "DOC502"]
preview = true
explicit-preview-rules = true

# E741 forbids `l` as a name. In OKLab, `l` IS the name of the lightness
# channel: `linear_to_oklab` returns `l, m, s` because that is what the
# published matrix calls its rows. Renaming to satisfy the linter would make
# the code harder to check against the reference, not easier.
#
# B905 wants `strict=` on every `zip()`. It is a 3.10 keyword, so it cannot be
# used in the file with the 3.8 floor, and adding it everywhere else buys a
# guard against a length mismatch that no zip here can have.
ignore = ["E741", "B905"]

# A misspelling is the one documentation defect this repository has no machinery
# for. Every gate here asks whether prose agrees with code; none of them reads
# the words. codespell is cheap enough to run on everything and found nothing on
# the day it was added, which is the same argument the threshold gate was written
# on: a check is worth having before it has something to say.
#
# The three exceptions are not typos, and each is a term the documents are right
# to use:
#
#   vermillion  the Okabe-Ito palette's own name for entry 7, as Wong spells it
#               in Nature Methods. The dictionary word has one `l`; the palette
#               does not, and renaming it would put this project's tables out of
#               step with every other citation of the same eight colours.
#   commun      "Nat. Commun.", the abbreviated journal title in a citation.
#   theses      the plural of thesis, in the list of documents a figure is made
#               for. codespell reads it as a misspelling of "these".
#   nd          "ND", Stone, Szafir & Setlur's notation for the noticeable
#               difference, inside the passage EXTERNAL_CLAIMS quotes from them.
#               A quote that is corrected is not a quote.
[tool.codespell]
skip = "./site,./.venv,./.git,uv.lock,*.png,*.svg"
ignore-words-list = "vermillion,commun,theses,nd"

[tool.mypy]
python_version = "3.11"
files = ["conda", "examples", "skill", "tests"]

# Every function in `skill/scripts` is annotated now, which the API page was
# what finally paid for: the reference renders parameter and return types out
# of the source, and an unannotated signature showed an empty Type column.
# Annotating them turned two real contradictions into errors mypy could state
# -- `Gate.func` declared `object` and then called, and a `check` row that
# returns "warn" against a docstring promising True or False.
#
# The strict flags stay off regardless. matplotlib and scipy ship incomplete
# stubs and pytest plugins ship none, so `disallow_untyped_defs` and friends
# would report the ecosystem rather than this project.
ignore_missing_imports = true

# Third-party types are not read at all, which is a larger hammer than it looks
# and is here for a specific reason. numpy's `__init__.pyi` uses PEP 695 `type`
# statements, and mypy refuses to parse those when `python_version` is below
# 3.12: it stops at the first one and reports "errors prevented further
# checking", so the run says nothing about this project's code at all. CI builds
# its venv on 3.13 and hit exactly that; a 3.11 venv happens to resolve an older
# numpy and did not, which is why this passed locally and failed on the first
# push.
#
# The alternative was raising `python_version` to 3.13, which would have made
# the stub parse and quietly stopped checking this code against the 3.11 floor
# it actually has to run on. Given `ignore_missing_imports` was already set, the
# gate was never leaning on matplotlib's or numpy's types; it is here for
# contradictions in this project's own code, and it still catches those. Drop
# this line once the floor reaches 3.12.
no_site_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # A missing font family is a real defect in a figure, but in CI the runner
    # simply has no serif installed and the fallback is correct behaviour.
    "ignore:findfont:UserWarning",
    # cmasher 1.9.2 builds each of its 114 colormaps with
    # `ListedColormap(..., N=...)`, deprecated in matplotlib 3.11 and removed
    # in 3.13, so importing the oracle emits 114 identical warnings. Ours is
    # not the code being warned about: nothing under `skill/scripts/` builds a
    # ListedColormap at all, so this cannot mask a defect of this project's.
    #
    # It is a countdown, not a fix. On matplotlib 3.13 cmasher stops importing
    # outright; `oracle()` in tests/test_palette_oracle.py skips with the
    # ImportError attached when that happens, so the suite stays green and says
    # what it stopped checking. Drop this line once cmasher ships the fix.
    "ignore:Passing 'N' to ListedColormap is deprecated:DeprecationWarning",
]

# cmasher is a TEST ORACLE and never a runtime dependency. `cmap_kind` is a
# port of its `get_cmap_type()` into OKLab, and `tests/test_palette_oracle.py`
# differentials the two across matplotlib's registry. It earned its place
# before it was written into a test: running the differential during design
# caught a wrong threshold that would otherwise have shipped 11 colormaps in
# the wrong family.
#
# cmasher pulls colorspacious, numpy and matplotlib, none of which the shipped
# scripts may import. It needed a `python_full_version >= '3.10'` marker while
# this project supported 3.9; the floor is 3.11 now, so the marker is gone and
# the oracle runs everywhere the tests do.
[dependency-groups]
dev = [
    "bump-my-version>=1.0",
    "cmasher>=1.9",
    "codespell>=2.3",
    "mypy>=1.11",
    "pytest>=7.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
    "scipy>=1.6",
]

# Separate from dev: the docs build needs nothing the tests need and the tests
# need nothing it needs, so `uv sync --group dev` on a test runner should not
# pull a theme.
#
# Pinned to a minor, not floored: Zensical is 0.0.x, so the usual reading of a
# lower bound -- "anything newer is compatible" -- does not hold.
#
# The marker outlived its reason and is kept anyway. It was load-bearing while
# `requires-python` was 3.9: Zensical needs 3.10, so without it uv resolved the
# group across the project's full range and failed outright. The floor is 3.11
# now, so it never excludes anything -- but `check_palette.py` is still claimed
# to run on 3.8 when vendored, and a marker that documents a tool's own floor
# costs nothing next to a resolution failure if that range ever widens again.
docs = [
    "mkdocstrings-python>=1.10 ; python_full_version >= '3.10'",
    "zensical==0.0.54 ; python_version >= '3.10'",
]

# griffe alone, for the job that asks whether the public API broke since the
# last tag. Its own group and not `dev`, so the answer does not wait behind
# matplotlib and scipy: the comparison is static, and installing the thing being
# compared would only slow it down.
#
# griffe arrives anyway as a dependency of `mkdocstrings-python` in `docs`. It
# is named here regardless, because a group that gets its tool by accident from
# another group's transitive tree stops working the day that tree changes, and
# the failure reads as the API check being broken rather than uninstalled.
api = [
    "griffe>=1.0",
]

# Out of `dev` on purpose: the documented command is
# `uv run rtk pytest tests/ -n auto -q`, and running the figure gates should not
# start requiring a 150MB Chromium. Without this group `test_docs_render.py`
# still collects -- so the documented test count is the same number on every
# machine -- and skips at run time. CI installs it in the docs job.
#
# Same marker as `docs`, and for the same reason.
docs-test = [
    "filelock>=3.12 ; python_full_version >= '3.10'",
    "playwright>=1.40 ; python_full_version >= '3.10'",
]
