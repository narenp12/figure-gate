# Zensical, not MkDocs. It will read a `mkdocs.yml` if it finds one, and that
# shim works — the first build of this site was an unmodified `mkdocs.yml`
# producing byte-comparable output. It is not what this project should ship,
# because one setting is read by MkDocs and silently ignored by Zensical:
# `strict: true`. Under Zensical strictness is the CLI flag `--strict`, so a
# config carried over from MkDocs builds a site with a dangling page and exits
# 0. Native config, and the flag where it belongs, in `.github/workflows/docs.yml`.
#
# The site is built from symlinks. `docs/` holds no prose of its own except
# gallery.md — every other page points at the file that already existed, so
# there is exactly one copy of the style guide and `test_docs_match_code.py`
# still reads the copy the site serves. A `docs/` of hand-maintained duplicates
# is the drift this project already has tests against; it would just be drift
# with a nicer stylesheet.

[project]
site_name = "figure-gate"
site_description = """
Mechanical gates for publication figures: colorblind-safe color, composition, \
and type legibility at print size.
"""
site_url = "https://narenp12.github.io/figure-gate/"
repo_url = "https://github.com/narenp12/figure-gate"
repo_name = "narenp12/figure-gate"

# Off, not defaulted. The edit link is built from the page's path under
# `docs/`, and every page here is a symlink — the link would open
# `docs/style-guide.md`, a 34-byte pointer, rather than the guide.
edit_uri = ""

extra_css = ["stylesheets/palette.css"]

nav = [
  { "Home" = "index.md" },
  { "Gallery" = "gallery.md" },
  { "The gates" = "style-guide.md" },
  { "Choosing a form" = "choosing-a-form.md" },
  { "Agent skill" = "skill.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
# Zensical's own look rather than `variant = "classic"`, which reproduces
# Material for MkDocs. The two differ in more than trim: classic's slate
# background is hsl(225, 15%, 14%) and modern's is hsl(225, 15%, 5%), which
# moves every dark-mode contrast measurement. `palette.css` quotes both, and
# the tests check both, so flipping this line does not silently invalidate the
# numbers.
variant = "modern"

# Unknown names in this list are accepted silently -- a build with
# "this.feature.does.not.exist" in it exits 0 and says nothing. So a typo here
# is a setting that does nothing rather than an error, and the only way to know
# a feature is on is to look at the built page.
features = [
  "content.code.copy",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# `primary`/`accent` of "custom" is the documented hand-off: the theme stops
# emitting color values of its own and `stylesheets/palette.css` becomes
# authoritative. Left unset, the theme's default hue would be competing with
# the stylesheet at equal specificity and winning or losing by file order.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Light"

# Only what the pages actually use. The style guide is tables and footnotes,
# the gallery is `md_in_html` figures, and every page is code blocks.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
