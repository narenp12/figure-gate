# Zensical, not MkDocs. It will read a `mkdocs.yml` if it finds one, and that
# shim works — the first build of this site was an unmodified `mkdocs.yml`
# producing byte-comparable output. It is not what this project should ship,
# because one setting is read by MkDocs and silently ignored by Zensical:
# `strict: true`. Under Zensical strictness is the CLI flag `--strict`, so a
# config carried over from MkDocs builds a site with a dangling page and exits
# 0. Native config, and the flag where it belongs, in `.github/workflows/docs.yml`.
#
# The site is built from symlinks wherever the prose already had a home. The
# pages authored here (gallery.md, gates.md, getting-started.md) are the
# single copy of what they say; every other page points at the file that
# already existed, so there is exactly one copy of the style guide and
# `test_docs_match_code.py` still reads the copy the site serves. A `docs/` of
# hand-maintained duplicates is the drift this project already has tests
# against; it would just be drift with a nicer stylesheet.

[project]
site_name = "figure-gate"
site_description = """
Mechanical gates for publication figures: colorblind-safe color, composition, \
and type legibility at print size.
"""
site_url = "https://narenp12.github.io/figure-gate/"
repo_url = "https://github.com/narenp12/figure-gate"
repo_name = "narenp12/figure-gate"

# Off, not defaulted. The edit link is built from the page's path under
# `docs/`, and every page here is a symlink — the link would open
# `docs/style-guide.md`, a 34-byte pointer, rather than the guide.
edit_uri = ""

extra_css = ["stylesheets/palette.css"]

# Pass 2: tablesort and its number plugin sort the gates table, and mermaid
# draws the flow diagram. Both engines are CDN scripts pinned to exact versions
# -- mermaid's renderer is not in the Zensical bundle (verified: the bundle
# carries the --md-mermaid-* CSS variables but no engine) and neither would be
# vendored as a minified blob nobody reads. `test_docs_site.py` holds the
# pinning, and a floating tag is the dependency discipline failure this project
# screens against. The two `javascripts/` files run the engines at view time via
# `document$.subscribe`, so both survive navigation.
extra_javascript = [
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
  "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js",
  "javascripts/tablesort.js",
  "https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js",
  "javascripts/mermaid.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "How to" = "how-to.md" },
  { "The gates" = "gates.md" },
  { "Gallery" = "gallery.md" },
  { "Style guide" = "style-guide.md" },
  { "API" = "api.md" },
  { "Choosing a form" = "choosing-a-form.md" },
  { "Agent skill" = "skill.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
# Zensical's own look rather than `variant = "classic"`, which reproduces
# Material for MkDocs. The two differ in more than trim: classic's slate
# background is hsl(225, 15%, 14%) and modern's is hsl(225, 15%, 5%), which
# moves every dark-mode contrast measurement. `palette.css` quotes both, and
# the tests check both, so flipping this line does not silently invalidate the
# numbers.
variant = "modern"

# Unknown names in this list are accepted silently -- a build with
# "this.feature.does.not.exist" in it exits 0 and says nothing. So a typo here
# is a setting that does nothing rather than an error, and the only way to know
# a feature is on is to look at the built page.
features = [
  "content.code.copy",
  "content.tabs.link",      # getting-started's two tab groups share the "vendored" label
  "content.code.annotate",  # how-to's numbered markers expand to prose
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# `primary`/`accent` of "custom" is the documented hand-off: the theme stops
# emitting color values of its own and `stylesheets/palette.css` becomes
# authoritative. Left unset, the theme's default hue would be competing with
# the stylesheet at equal specificity and winning or losing by file order.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Light"

# Only what the pages actually use. The style guide is tables and footnotes,
# the gallery is `md_in_html` figures, and every page is code blocks.
# getting-started is `tabbed`, how-to is annotations/collapsibles/definition
# lists, and the glossary `abbr` serves every page from one include.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
# gates.md's flow diagram. `fence_code_format` keeps the fence's text in a
# `.mermaid` div for the CDN engine (loaded via extra_javascript above) to read
# and replace with an SVG at view time -- the same pattern as the tablesort
# init, both run by `document$.subscribe`.
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.abbr]
[project.markdown_extensions.def_list]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.tabbed]
# `alternate_style` is the panel with the border and the active state; the
# default tabbed style is a text block with no border and no selection.
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
# The home page's card-grid tiles carry one lucide icon each. The generator
# and index are Zensical's own: it ships the icon set under the theme's
# templates, and `_resolve_pymdownx_emoji` turns these two strings into the
# functions. Without the extension the `:lucide-rocket:` shortcodes render as
# literal text.
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.snippets]
# `base_path` is explicit because the default, ".", resolves against the
# config's directory: unqualified, Zensical reads `<repo>/includes/...`.
base_path = ["docs"]
auto_append = ["includes/abbreviations.md"]

# `api.md` is the one page with no prose file behind it: it is `:::` directives,
# and mkdocstrings reads the signatures and docstrings out of the scripts at
# build time. That is the same argument as the symlinks above -- a hand-written
# reference is a second copy of every signature and default, and this project
# already has a test file about prose drifting from the code it describes.
#
# Zensical's own extension rather than the mkdocstrings plugin: `plugins:` is
# MkDocs configuration, and the comment at the top of this file is about what
# Zensical silently ignores from one. The extension is what it actually runs.
[project.markdown_extensions."zensical.extensions.mkdocstrings".handlers.python]
# The scripts are three loose files meant to be vendored, not a package, so
# there is no import path to walk -- the handler is pointed at the directory.
paths = ["skill/scripts"]

[project.markdown_extensions."zensical.extensions.mkdocstrings".handlers.python.options]
docstring_style = "google"
# The page is a reference, and a reference is looked things up in rather than
# read. The `Args:` and `Returns:` sections render as tables, which is the part
# a caller scans; the narrative under each stays for the reader who wants the
# why. The symbol type shows in the heading and in the table of contents, so
# the contents list doubles as the index of what each module exports.
#
# `summary` is deliberately absent. It renders an index of a rendered object's
# members, and every directive on the page names one function, so there is no
# parent to summarise: switched on, it emitted nothing at all.
docstring_section_style = "table"
show_symbol_type_heading = true
show_symbol_type_toc = true
# `brief` over `full`: these are loose files, so a fully qualified annotation
# path names a module the reader would import as a single file anyway.
annotations_path = "brief"
# On, and this is what makes the page a reference rather than an essay. Each
# `:::` here names one function, so the root heading is that function's name
# and its signature; with it off, every entry rendered as an unheaded block of
# description with no signature above it and no ToC entry to reach it by.
show_root_heading = true
show_root_toc_entry = true
show_source = true
# Signatures carry the defaults, which for `audit()` and `check()` are half of
# what a caller needs to know: `placed_frac=1.0` and `all_pairs=False` are
# decisions, not filler.
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
# Every member here is listed explicitly on the page, so an undocumented
# addition is a name missing from `api.md` rather than a block that appears
# without anyone deciding it should.
members_order = "source"
filters = ["!^_"]
heading_level = 3
