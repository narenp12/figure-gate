schema_version: 1

context:
  name: figure-gate
  version: "0.9.0.dev0"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/figure-gate/figure_gate-${{ version }}.tar.gz
  sha256: e4930904c3653c08318e11b6d74972621bba6103746043ea31c3e528edff7656

build:
  # Since 0.7.0 the three modules install as the `figure_gate` package, which is
  # what the entry points and the import tests below spell. Through 0.6.0 they
  # were loose files at the root of site-packages, so that a vendored copy and
  # an installed one took the same import line; the generic names cost more than
  # the symmetry was worth. The style sheet ships inside the package, beside the
  # module that reads it.
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - check-palette = figure_gate.check_palette:main
      - check-figure = figure_gate.check_figure:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.26
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.8

tests:
  - python:
      imports:
        - figure_gate
        - figure_gate.check_palette
        - figure_gate.check_figure
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - check-palette --help
      # Takes no arguments; runs a self-test that exits 0 only on a correct FAIL.
      - check-figure

about:
  homepage: https://github.com/narenp12/figure-gate
  repository: https://github.com/narenp12/figure-gate
  documentation: https://narenp12.github.io/figure-gate/
  summary: "Mechanical gates for publication figures: colorblind-safe color, composition, and type legibility at print size."
  description: |
    figure-gate audits a matplotlib figure before it goes into a paper, a
    slide deck or a thesis, and fails it on defects that survive a look at the
    screen: a hue pair a colour-blind reader cannot tell apart, a colormap
    whose lightness reverses on itself instead of ordering the data, axis
    labels that fall below a legible point size once the figure is scaled to
    its column width, clipped text, and Type 3 fonts, which IEEE PDF eXpress
    refuses at upload.

    Two commands, check-palette and check-figure. An install exposes the
    modules as figure_gate.check_palette and figure_gate.check_figure; through
    0.6.0 they were loose modules at the root of site-packages. Either file is
    also meant to be copied into a project outright, and check_palette.py
    imports nothing outside the standard library. Every gate has a test that
    proves it can fail.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - narenp12
