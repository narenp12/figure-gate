name: Rehearse release on TestPyPI

# Renders the project page before a version is spent on the real index. Manual
# only, so it cannot race the release. TestPyPI refuses version reuse too, so a
# second rehearsal needs a bump or a `.devN` suffix you never tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/figure-gate
    permissions:
      id-token: write
      contents: read
    steps:
      # `uv publish --index` reads the index out of pyproject.toml, hence checkout.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      - run: uv publish --index testpypi --trusted-publishing always
