name: Rehearse release on TestPyPI

# Renders the project page before a version is spent on the real index. Manual
# only, so it cannot race the release. TestPyPI refuses version reuse too, so a
# second rehearsal needs a bump or a `.devN` suffix you never tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/figure-gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      # Same uploader as the real release. A rehearsal on a different mechanism
      # rehearses the wrong thing -- the missing attestations on 0.1.0 went
      # unnoticed here for exactly that reason.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
