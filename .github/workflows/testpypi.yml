name: Rehearse release on TestPyPI

# Renders the project page before a version is spent on the real index. Manual
# only, so it cannot race the release. TestPyPI refuses version reuse too, so a
# second rehearsal needs a bump or a `.devN` suffix you never tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/figure-gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      # Same uploader as the real release. A rehearsal on a different mechanism
      # rehearses the wrong thing: attestations, for one, come from the
      # uploader.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
