name: Rehearse release on TestPyPI

# Renders the project page before a version is spent on the real index. Manual
# only, so it cannot race the release. TestPyPI refuses version reuse too, so a
# second rehearsal needs a bump or a `.devN` suffix you never tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/figure-gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      # Same uploader as the real release. A rehearsal on a different mechanism
      # rehearses the wrong thing: attestations, for one, come from the
      # uploader.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
