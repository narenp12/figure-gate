name: CodeQL

# The scripts in skill/scripts are meant to be copied into other people's
# projects, so a defect that only shows up on hostile input is their problem
# too. CodeQL runs on every change and weekly, because a query pack updated
# after a merge can find something the merge itself did not.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Same shape as ci.yml. A superseded pull-request run analyses a tree that has
# been replaced, and its alerts would be attributed to a commit already gone.
# The scheduled and push runs get a unique group and are never touched: the
# weekly run is the one that catches a query pack updated after a merge, so it
# must not be cancellable by a pull request that happens to land beside it.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    # 10, down from 30. Measured across three runs: `python` peaks at 1m13s
    # and `actions` at 48s, both including the query pack download. Ten leaves
    # room for a cold pack and for `security-and-quality` growing, without
    # leaving half an hour on the clock for a job that takes one minute.
    timeout-minutes: 10
    permissions:
      # Writing alerts is the whole point; nothing here needs anything else.
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflows themselves. It is here because
        # release.yml interpolates `github.ref_name` into a shell block, and
        # that class of injection is exactly what the pack looks for.
        language: [python, actions]
    steps:
      # Pinned by commit for the same reason the release workflow is: this job
      # holds security-events: write, and a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # init and analyze move together, always. They are one action published
      # under one tag, and a run that mixes two versions dies in the analyze
      # post-action with "Loaded a configuration file for version X, but
      # running version Y". Dependabot raised them as PR #52 and PR #54, one
      # line each, and both failed for that reason; neither could have gone
      # green alone, and merging either would have broken CodeQL on main until
      # the other landed. The group in dependabot.yml now keeps them in one
      # pull request.
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Beyond the default pack: this repository is small enough that the
          # extra query time costs nothing and the noise floor is low.
          queries: security-and-quality

      # No build step. Everything here is interpreted, and CodeQL's extractors
      # read the tree directly.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
