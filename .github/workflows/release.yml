name: Release

# Publishing is tag-driven and gated on the same tests CI runs, so a release can
# only ever be cut from a commit whose gates pass. Trusted publishing means no
# API token lives in this repository: PyPI verifies the OIDC identity of this
# workflow instead.
# workflow_dispatch builds and tests but cannot publish -- see the guard on the
# publish job. It exists so a release can be rehearsed against a branch without
# the run being able to reach the index.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra fast --dev
      - run: uv run pytest tests -q

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build

      # The tag is the version of record. If it disagrees with pyproject.toml,
      # stop here rather than publish a release whose number is a lie.
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Without this the workflow_dispatch trigger is a publish button: the
    # version check above is skipped when there is no tag, so a manual run from
    # any branch would push whatever version pyproject.toml happened to carry.
    # The tag is the only thing allowed to release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/figure-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v9
      # --check-url makes a re-run idempotent: a job that died partway through
      # an upload can be retried without tripping over the files it already
      # landed, which matters because the version cannot be re-cut.
      - run: uv publish --check-url https://pypi.org/simple/
