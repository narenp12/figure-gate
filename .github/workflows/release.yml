name: Release

# Only a tag releases. Dispatch builds and tests without reaching the index.
# Actions are pinned by commit, not tag: a tag can be moved, and this workflow
# holds id-token: write, so a moved tag is a PyPI release someone else wrote.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra fast --dev
      - name: Install xelatex for PGF backend test
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex
      - run: uv run pytest tests -q

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build

      # A release number that disagrees with the project is worse than no release.
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # The version check above is skipped when there is no tag, so without this
    # guard workflow_dispatch is a publish button.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/figure-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # `uv publish` uploaded 0.1.0 without provenance -- PyPI's integrity
      # endpoint 404s for it -- so the upload runs through the PyPA action,
      # which signs the files and attaches a PEP 740 attestation. Nothing else
      # about the pipeline changes; uv still builds.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  # v0.1.2 and v0.1.3 shipped to PyPI and left no GitHub release, because this
  # workflow used to end at the step above. The notes are cut from CHANGELOG.md
  # rather than written here or generated from commits: the changelog is the
  # place the release is already described, and two hand-maintained copies of
  # the same prose drift.
  #
  # Its own job, not a step in `publish`. Creating a release needs
  # `contents: write`, and the job above holds `id-token: write` -- the token
  # that can upload to PyPI as this project. Those two permissions do not need
  # to be held together and this file's header already says why that matters.
  github-release:
    name: Create the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail rather than publish an empty release: a release whose notes are
      # blank is worse than the missing release this job exists to prevent.
      - name: Cut the notes for this version out of CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "no '## $version' section in CHANGELOG.md" >&2
            exit 1
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "figure-gate $version" \
            --notes-file notes.md \
            --verify-tag \
            --latest
