name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push while a deploy is in flight should replace it, not queue behind
# it -- but never cancel one mid-upload, which leaves Pages serving a partial
# site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs on pull requests too, and that is the point: the site is checked
  # before it is published, not after. The deploy below just takes what this
  # job produced.
  #
  # Three separate checks, because no one of them covers the others:
  #
  #   --strict            fails on a broken link BETWEEN pages. It does not
  #                       fail on a nav entry whose file cannot be read: that
  #                       page is silently not built, the nav renders a raw
  #                       `./style-guide.md` href, and the build exits 0. This
  #                       was measured, not assumed.
  #   symlink check       runs BEFORE the build, and is the only thing that
  #                       catches a dangling pointer at all. Every page here is
  #                       a symlink into skill/ or the repository root.
  #   nav-page check      runs AFTER, and closes the gap between the two: if a
  #                       page in the nav produced no HTML, the site would ship
  #                       a 404 in its own sidebar.
  #
  # The flag is not optional and cannot move into the config. Zensical has no
  # `strict` setting -- MkDocs did, and Zensical reads a `mkdocs.yml` without
  # honouring that key, which is how a migrated project quietly stops failing.
  # `test_docs_site.py` asserts no `mkdocs.yml` is left in the repository.
  build:
    name: The site builds in strict mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Every page under docs/ is a symlink into skill/ or the repository root.
      # actions/checkout restores them as symlinks, so this is a cheap way to
      # find out that it did before the build reports a confusing missing-file.
      - name: Every docs/ symlink resolves in a fresh checkout
        run: |
          uv run --no-project python - <<'PY'
          import pathlib, sys
          dangling = [str(p) for p in pathlib.Path("docs").rglob("*")
                      if p.is_symlink() and not p.exists()]
          for p in sorted(pathlib.Path("docs").rglob("*")):
              if p.is_symlink():
                  print(("  ok " if p.exists() else "MISS ") + str(p))
          if dangling:
              sys.exit(f"dangling symlinks under docs/: {dangling}")
          PY

      # `--only-group docs`, not `--no-project --with "zensical..."`. The
      # `--with` form spelled the version range a second time, in a file nothing
      # resolves against `pyproject.toml`, and it was correct only for as long
      # as the two lists happened to agree. They stopped agreeing the first time
      # the build needed a package one of them did not name: the group gained
      # `mkdocstrings-python` for the API page, this line did not, and the build
      # failed with `No module named 'mkdocstrings'` after the same build passed
      # locally in a project environment that had it. One list now, in
      # `pyproject.toml`; `test_docs_site.py` fails if a second one appears.
      #
      # `--only`, because the group comment claims the docs build needs nothing
      # the tests need. Plain `--group` would install the project and `dev`
      # alongside it, and the claim would stop being checked by anything.
      - name: Build
        run: uv run --only-group docs zensical build --strict

      # The gap `--strict` leaves. A nav entry whose file cannot be read is
      # dropped from the build with no error and no page, and the sidebar then
      # links to a path that 404s. Assert every page named in the nav exists as
      # HTML in the output.
      - name: Every page in the nav was actually built
        run: |
          uv run --no-project python - <<'PY'
          import pathlib, re, sys
          config = pathlib.Path("zensical.toml").read_text()
          nav = re.search(r"^nav = \[(.*?)^\]", config, re.S | re.M)
          if not nav:
              sys.exit("could not read the nav out of zensical.toml")
          pages = re.findall(r'"([^"]+)\.md"', nav.group(1))
          if not pages:
              sys.exit("matched no pages in the nav - the parser needs updating")
          missing = []
          for page in pages:
              built = pathlib.Path("site/index.html" if page == "index"
                                   else f"site/{page}/index.html")
              print(("  ok " if built.is_file() else "MISS ") + str(built))
              if not built.is_file():
                  missing.append(page)
          if missing:
              sys.exit(f"in the nav but not built: {missing}")
          print(f"{len(pages)} nav pages all built")
          PY

      # The gallery is symlinks to examples/*.png. If one is missing the page
      # still builds and ships broken images, so check the bytes arrived.
      - name: Every gallery image is in the built site
        run: |
          uv run --no-project python - <<'PY'
          import pathlib, sys
          site = pathlib.Path("site/images")
          missing = [p.name for p in pathlib.Path("examples").glob("*.png")
                     if not (site / p.name).is_file()
                     or (site / p.name).stat().st_size == 0]
          if missing:
              sys.exit(f"images missing or empty in the built site: {missing}")
          print(f"{len(list(site.glob('*.png')))} images built")
          PY

      # Everything above proves the pages exist. This proves they are readable.
      #
      # The distinction is not academic: a stylesheet whose selectors match
      # nothing builds clean, passes a test suite that checks the hex values
      # written in it, and ships a header at 1.00:1. Only rendering catches
      # that, so Chromium resolves the cascade and composites the translucent
      # surfaces, and `check_palette.contrast()` -- the figures' own gate --
      # judges the result. `tests/test_docs_render.py` has the long version.
      #
      # On pull requests too, like the rest of this job. A contrast regression
      # should fail before it is published, not after.
      - name: Install the browser the contrast gate renders in
        run: uv run --group docs-test playwright install --with-deps chromium

      - name: The rendered site clears the text contrast floor
        run: uv run --group docs-test pytest tests/test_docs_render.py -q

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    # Main only. A pull request builds the site to prove it builds; it does not
    # get to publish it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
