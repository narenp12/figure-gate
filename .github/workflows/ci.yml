name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Stated rather than inherited, so the repository default can change without
# quietly handing a write token to a job that only runs tests.
permissions:
  contents: read

jobs:
  # The README claims check_palette.py runs on Python 3.8+ with nothing
  # installed. That claim is load-bearing -- it is why the file is usable from a
  # non-Python toolchain -- so it gets its own job with no pip install at all,
  # rather than being assumed.
  stdlib-only:
    name: check_palette on Python ${{ matrix.python }} (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: A valid palette exits 0
        run: python skill/scripts/check_palette.py "#E69F00,#56B4E9,#009E73" --pairs all
      - name: An invalid palette exits non-zero
        run: |
          if python skill/scripts/check_palette.py "#808080,#0072B2"; then
            echo "::error::a gray 'color' passed the chroma floor"
            exit 1
          fi

  test:
    name: pytest, Python ${{ matrix.python }}, matplotlib ${{ matrix.matplotlib }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        matplotlib: ["latest"]
        include:
          - python: "3.9"
            matplotlib: "3.8.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: |
          uv pip install --system pytest pytest-xdist
          if [ "${{ matrix.matplotlib }}" = "latest" ]; then
            uv pip install --system matplotlib
          else
            uv pip install --system "matplotlib==${{ matrix.matplotlib }}"
          fi
      - run: pytest -n auto -q

      - name: The checker rejects a deliberately bad figure
        run: python skill/scripts/check_figure.py

      - name: Every gallery figure passes its own audit
        run: python examples/gallery.py

      - name: The example builds and passes its own gates
        run: python examples/demo.py

  skill:
    name: Skill metadata is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: SKILL.md has parseable frontmatter with name and description
        run: |
          python - <<'PY'
          import sys, yaml, pathlib
          text = pathlib.Path("skill/SKILL.md").read_text()
          if not text.startswith("---"):
              sys.exit("SKILL.md is missing YAML frontmatter")
          meta = yaml.safe_load(text.split("---", 2)[1])
          for key in ("name", "description"):
              if not meta.get(key):
                  sys.exit(f"SKILL.md frontmatter is missing {key!r}")
          if meta["name"] != "research-figures":
              sys.exit(f"unexpected skill name: {meta['name']!r}")
          print(f"ok: {meta['name']} ({len(meta['description'])} char description)")
          PY
      - name: Files the skill references actually exist
        run: |
          test -f skill/assets/figure.mplstyle
          test -f skill/scripts/check_palette.py
          test -f skill/scripts/check_figure.py
          test -f skill/references/style-guide.md
          test -f skill/references/choosing-a-form.md
      - name: Every path SKILL.md names resolves
        run: |
          python - <<'PY'
          import pathlib, re, sys
          skill = pathlib.Path("skill")
          text = (skill / "SKILL.md").read_text()
          named = sorted(set(re.findall(
              r"(?:references|assets|scripts)/[A-Za-z0-9_.-]+", text)))
          missing = [p for p in named if not (skill / p).is_file()]
          for p in named:
              print(("  ok " if p not in missing else "MISS ") + p)
          if missing:
              sys.exit(f"SKILL.md names files that do not exist: {missing}")
          print(f"{len(named)} referenced paths all resolve")
          PY
