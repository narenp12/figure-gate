name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Stated rather than inherited, so the repository default can change without
# quietly handing a write token to a job that only runs tests.
permissions:
  contents: read

# A second push to a pull request makes the first push's answer worthless: this
# matrix is eight jobs across three operating systems, and the older run spends
# all of it on a commit nobody is waiting on. Cancel it.
#
# Pushes are keyed on `github.run_id`, which is unique, so they never share a
# group and a run on main is never cancelled or queued by anything. That is
# deliberate and not symmetry for its own sake -- a shared group would put two
# main pushes in one line, and GitHub evicts the pending one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The documentation claims check_palette.py runs on Python 3.8+ with nothing
  # installed. That claim is why the file is usable from a non-Python
  # toolchain, so it gets its own job with no pip install at all,
  # rather than being assumed.
  stdlib-only:
    name: check_palette on Python ${{ matrix.python }} (no dependencies)
    runs-on: ubuntu-latest
    # 5 here and on `lint`, `api`, `package` and `skill`, down from 10 and 15.
    # Measured across three successful runs on main, the slowest of those five
    # took 22 seconds and the fastest 7. A single floor rather than a bound
    # fitted to each one: the point of the number is to catch a hang, and five
    # minutes is already more than an order of magnitude of headroom over jobs
    # that do a checkout and run one script. `test` and `pgf` keep their own
    # bounds and have their own reasons, written where they are set.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: A valid palette exits 0
        run: python skill/scripts/check_palette.py "#E69F00,#56B4E9,#009E73" --pairs all
      - name: An invalid palette exits non-zero
        run: |
          if python skill/scripts/check_palette.py "#808080,#0072B2"; then
            echo "::error::a gray 'color' passed the chroma floor"
            exit 1
          fi

  # Its own job rather than a step on `test`: this says nothing about whether
  # the gates work, so it should not wait behind a TeX install to say it, and a
  # lint failure should not read as a broken checker.
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --group dev

      # The 3.8 floor on check_palette.py is enforced here through
      # `per-file-target-version`, not only by the stdlib-only job below. That
      # job proves the two invocations it makes still run; this reads the whole
      # file against the 3.8 grammar.
      - run: uv run ruff check --output-format github .
      - run: uv run mypy

  # `check_palette.py` is meant to be vendored: copied into somebody else's
  # toolchain and called directly. A renamed function there does not break a
  # dependency resolver, it breaks a file somebody pasted into their repository
  # six months ago, silently, at import.
  #
  # griffe reads both modules as they stand and as they stood at the last
  # release tag, and reports what a caller could no longer do. This is not a
  # veto: a 0.x project is allowed to break its API. It is a join between the
  # break and the prose, because the thing that actually harms a vendoring
  # reader is a break the changelog did not mention.
  api:
    name: A break in the public API is one the changelog admits to
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Tags, not just the tip. The default checkout has neither the history
      # nor the tags, so the comparison would have nothing to compare against
      # and would pass by having no opinion.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The gate itself lives in skill/scripts/audit_api.py, which `make
      # audit-api` also runs and tests/test_audit_api.py covers. This job used
      # to carry its own copy of the same logic, and the two drifted: the copy
      # here accepted six changelog verbs where the script accepts twelve, so a
      # release note saying a symbol "gained" a row passed locally and failed
      # here. One gate, one implementation, and the implementation is the one
      # with tests.
      - name: Compare every module against the last release
        run: uv run --only-group api python skill/scripts/audit_api.py

  test:
    name: pytest, ${{ matrix.os }}, Python ${{ matrix.python }}, matplotlib ${{ matrix.matplotlib }}
    runs-on: ${{ matrix.os }}
    # The suite runs in a couple of minutes. The bound stays because a hung job
    # is not a failure, it is a runner held to GitHub's six-hour cap with the
    # run yellow the whole time. It is 10 rather than 20 now that the TeX
    # install is not in front of the tests.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Linux carries the version matrix; macOS and Windows get one leg each, on
      # the newest supported Python and matplotlib.
      #
      # Two legs rather than a third dimension, because what the other platforms
      # are here to check is not version-specific. `check_fonts` asks whether the
      # family a figure names is one the machine can actually resolve, and font
      # availability is the most OS-dependent thing this project touches -- every
      # run until now was on a Linux image with one font situation. The rest is
      # path handling: `_style_sheet` joins paths and `alt_metadata` switches on
      # a filename suffix, and neither had ever been asked a question on a
      # case-insensitive filesystem or behind a backslash separator.
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        matplotlib: ["latest"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            matplotlib: "3.8.4"
          - os: macos-latest
            python: "3.13"
            matplotlib: "latest"
          - os: windows-latest
            python: "3.13"
            matplotlib: "latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # uv.lock now that it is committed. It used to say pyproject.toml,
          # because the lock was gitignored and the glob matched nothing -- and
          # pyproject only moves when a constraint is edited, so a transitive
          # release changed what got installed without changing the key. The
          # cache is only re-saved when the primary key misses ("if the provided
          # `key` doesn't match an existing cache, a new cache is automatically
          # created"), so a key that never moves is a cache that never refreshes.
          # The lock moves exactly when the resolution does.
          cache-dependency-glob: "uv.lock"
      - name: Install
        # Stated, because the default on the Windows leg is pwsh and the `if`
        # below is `[ ... ]`, which pwsh parses as an array literal and runs
        # without error -- selecting the wrong branch rather than failing.
        shell: bash
        run: |
          uv pip install --system pytest pytest-xdist
          if [ "${{ matrix.matplotlib }}" = "latest" ]; then
            uv pip install --system matplotlib
          else
            uv pip install --system "matplotlib==${{ matrix.matplotlib }}"
          fi
      # The classifier's thresholds were justified by a differential against
      # cmasher across 148 colormaps, and until now that differential never ran
      # anywhere but a developer machine: this job installs pytest, xdist and
      # matplotlib and nothing else, so `test_palette_oracle.py` skipped on
      # every CI run since it was written. An oracle that only runs where
      # someone remembers to install it is not a check.
      #
      # One job, not three. The differential is over matplotlib's registry
      # rather than over anything version-specific, so running it on every leg
      # would buy three copies of one answer.
      - name: Install the differential oracle (this job only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.matplotlib == 'latest'
        run: uv pip install --system cmasher
      # The one test that needs a real TeX runs in the `pgf` job below rather
      # than here. It skips itself on every leg of this matrix, which is what
      # that job exists to assert.
      - run: pytest -n auto -q

      - name: The checker rejects a deliberately bad figure
        run: python skill/scripts/check_figure.py

      - name: Every gallery figure passes its own audit
        run: python examples/gallery.py

      - name: The example builds and passes its own gates
        run: python examples/demo.py

  # Its own job rather than a step on `test`, for the reason `lint` above gives:
  # this says nothing about whether the gates work, so it should not wait behind
  # a TeX install to say it. `test` carried the install for a while and paid for
  # it twice. A stalled apt mirror delayed the whole suite's answer rather than
  # one narrow assertion, and the several hundred megabytes of texlive-xetex sat
  # in front of a run that finishes in about two minutes.
  #
  # What it checks: `test_pgf_rejects_the_metadata_kwarg_at_any_value` asserts
  # that matplotlib's PGF backend still refuses `metadata=`. That is a fact
  # about the backend rather than about the matplotlib version pinned on a leg,
  # so one job answers it and the `test` matrix skips it everywhere.
  #
  # Ubuntu because the install below is apt. The equivalents elsewhere are
  # MacTeX and MiKTeX, both slower to install and neither exercising anything
  # this test is about: the assertion is that matplotlib raises, not that a
  # particular TeX distribution renders.
  #
  # Every part of the install is there for a reason the hang taught: `timeout`
  # because a stalled mirror is not an error and apt will wait on it forever,
  # the loop because the next mirror usually works, and no `-qq` on the install
  # because a silent step gives a reader nothing to look at when it does stall
  # again.
  pgf:
    name: The PGF backend still refuses metadata=
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: uv pip install --system pytest matplotlib
      - name: Install TeX
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq \
               && timeout 600 sudo apt-get install -y --no-install-recommends texlive-xetex; then
              exit 0
            fi
            echo "::warning::apt-get failed or stalled on attempt $attempt"
            sleep $((attempt * 15))
          done
          echo "::error::could not install texlive-xetex in three attempts"
          exit 1

      # The test skips itself when xelatex is missing, and a skip is invisible
      # in a green run: that is exactly how test_palette_oracle.py sat dead for
      # months. This job is the only place the row can run, so assert that it
      # ran rather than trusting the install step above.
      - name: The PGF test ran here rather than skipping
        run: |
          pytest tests/test_figure.py::test_pgf_rejects_the_metadata_kwarg_at_any_value \
            -q -rs | tee "$RUNNER_TEMP/pgf.log"
          grep -q "1 passed" "$RUNNER_TEMP/pgf.log"

  # The tests reconstruct the installed layout by copying files. That catches a
  # dropped force-include in pyproject.toml, but it cannot catch the build
  # producing something else, and the gap it was written for lived exactly
  # there: the wheel shipped `skill/scripts` and no style sheet, so gate 16 read
  # "nothing to compare" -- a pass -- for a figure drawn on stock matplotlib.
  # So: build the real wheel, install it, and run the gate that used to be dead.
  package:
    name: The wheel gates a figure the way the checkout does
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv build --wheel
      - name: The wheel ships figure.mplstyle, and ships nothing else it should not
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          print("\n".join(sorted(names)))
          if "figure_gate/figure.mplstyle" not in names:
              sys.exit(f"{wheel} has no figure_gate/figure.mplstyle, so "
                       "_style_sheet finds nothing once installed")
          # Release tooling. It has no caller outside this repository, and the
          # wheel takes everything in skill/scripts, so it would ship without
          # the exclusion that keeps it out.
          if "figure_gate/audit_api.py" in names:
              sys.exit(f"{wheel} ships audit_api.py")
          # PEP 561: without this, every annotation in the package resolves to
          # Any in a caller's type checker.
          if "figure_gate/py.typed" not in names:
              sys.exit(f"{wheel} has no py.typed")
          # Nothing outside the package. Through 0.6.0 this wheel put
          # check_figure, check_palette and suggest_fixes at the top level of
          # site-packages -- generic names on a namespace shared with every
          # other distribution, and permanent once callers import them.
          stray = [n for n in names
                   if not n.startswith(("figure_gate/", "figure_gate-"))]
          if stray:
              sys.exit(f"{wheel} claims top-level names: {stray}")
          PY
      - name: A figure with no plt.style.use fails the gate on the install path
        run: |
          # --no-project, so this runs against the installed wheel rather than
          # the checkout sitting one directory up.
          uv run --no-project --with "$(echo dist/*.whl)" python - <<'PY'
          import sys
          import matplotlib
          matplotlib.use("agg")
          import matplotlib.pyplot as plt
          from figure_gate import check_figure

          sheet = check_figure._style_sheet()
          if sheet is None or "site-packages" not in str(sheet):
              sys.exit(f"the checker resolved {sheet!r}, not an installed sheet")

          fig, ax = plt.subplots()
          ax.plot([0, 1], [0, 1])
          status, detail = check_figure.check_style_sheet(fig)
          print("stock matplotlib ->", status, "|", detail)
          if status != "warn":
              sys.exit("gate 16 passed a figure drawn on stock matplotlib")

          plt.style.use(str(sheet))
          status, detail = check_figure.check_style_sheet(fig)
          print("sheet applied    ->", status, "|", detail)
          if status is not True:
              sys.exit("the shipped sheet does not clear its own gate")
          PY

  skill:
    name: Skill metadata is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: SKILL.md has parseable frontmatter with name and description
        run: |
          python - <<'PY'
          import sys, yaml, pathlib
          text = pathlib.Path("skill/SKILL.md").read_text()
          if not text.startswith("---"):
              sys.exit("SKILL.md is missing YAML frontmatter")
          meta = yaml.safe_load(text.split("---", 2)[1])
          for key in ("name", "description"):
              if not meta.get(key):
                  sys.exit(f"SKILL.md frontmatter is missing {key!r}")
          if meta["name"] != "research-figures":
              sys.exit(f"unexpected skill name: {meta['name']!r}")
          print(f"ok: {meta['name']} ({len(meta['description'])} char description)")
          PY
      # The skill is also distributed as a Claude Code plugin, and plugin.json
      # carries its own `version`. Claude Code pins installs to that string, so
      # a release that bumps pyproject.toml and forgets plugin.json ships new
      # files under the old version and no installed copy ever updates. The tag
      # check in release.yml already exists for the same reason one level up;
      # this is the same check for the second place the version is written.
      - name: The plugin manifest and pyproject agree on the version
        run: |
          python - <<'PY'
          import json, pathlib, sys, tomllib

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          manifest = json.loads(
              pathlib.Path("skill/.claude-plugin/plugin.json").read_text())
          plugin = manifest.get("version")

          if plugin != project:
              sys.exit(f"skill/.claude-plugin/plugin.json says {plugin!r}, "
                       f"pyproject.toml says {project!r}")
          print(f"ok: both say {project}")
          PY

      # A marketplace entry whose `source` does not resolve is only discovered
      # when someone runs `/plugin install` and it fails, which is after the
      # push that broke it.
      - name: The marketplace entry points at a real plugin
        run: |
          python - <<'PY'
          import json, pathlib, sys

          market = json.loads(
              pathlib.Path(".claude-plugin/marketplace.json").read_text())
          problems = []

          for entry in market["plugins"]:
              source = entry["source"]
              if not isinstance(source, str):
                  continue  # a git or GitHub source is not ours to resolve
              root = pathlib.Path(source)
              own = root / ".claude-plugin" / "plugin.json"
              if not own.is_file():
                  problems.append(f"{entry['name']}: no plugin.json under {root}")
                  continue
              name = json.loads(own.read_text()).get("name")
              if name != entry["name"]:
                  problems.append(
                      f"marketplace calls it {entry['name']!r}, "
                      f"{own} calls it {name!r}")
              if not (root / "SKILL.md").is_file() and not (root / "skills").is_dir():
                  problems.append(f"{entry['name']}: {root} has no SKILL.md and "
                                  "no skills/ directory, so it loads with no skill")
              print(f"  ok {entry['name']} -> {root}")

          if problems:
              sys.exit("\n".join(problems))
          PY

      - name: Files the skill references actually exist
        run: |
          test -f skill/assets/figure.mplstyle
          test -f skill/scripts/check_palette.py
          test -f skill/scripts/check_figure.py
          test -f skill/references/style-guide.md
          test -f skill/references/choosing-a-form.md
      - name: Every path SKILL.md names resolves
        run: |
          python - <<'PY'
          import pathlib, re, sys
          skill = pathlib.Path("skill")
          text = (skill / "SKILL.md").read_text()
          named = sorted(set(re.findall(
              r"(?:references|assets|scripts)/[A-Za-z0-9_.-]+", text)))
          missing = [p for p in named if not (skill / p).is_file()]
          for p in named:
              print(("  ok " if p not in missing else "MISS ") + p)
          if missing:
              sys.exit(f"SKILL.md names files that do not exist: {missing}")
          print(f"{len(named)} referenced paths all resolve")
          PY
