version: 2

updates:
  # Actions are pinned by commit in every workflow, which means nothing about
  # them updates on its own -- a pinned SHA is frozen until someone moves it.
  # This is the thing that moves it, and it rewrites the trailing `# vX.Y.Z`
  # comment along with the SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Ungrouped, deliberately: one action per pull request puts each version
    # change in the title. A grouped run (PR #10) hid a setup-uv downgrade,
    # v9.0.0 to v7.6.0 on the workflow that publishes to PyPI, under twelve
    # green checks.
    #
    # One exception, and only where the coupling is the action's own. The
    # codeql-action directories are one action released under one tag: a run
    # whose init and analyze disagree fails in the analyze post-action with
    # "Loaded a configuration file for version X, but running version Y". Split
    # across two pull requests (#52 and #54) neither half can go green, and
    # merging either leaves main in the state that produces that error. The group is the narrowest one that covers it -- the pattern
    # matches nothing but codeql-action, so the visibility the ungrouped
    # default buys for unrelated actions is untouched.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

# No Python entry, deliberately. Every dependency is a floor
# (`matplotlib>=3.8`, `pytest>=7.0`), and a floor already admits the newest
# release. The committed uv.lock would give a `uv` entry something to bump, but
# the lock governs the `uv run` and `uv sync` jobs only: lint, api, and the docs
# build. The test
# matrix installs through `uv pip install --system`, which does not read the
# lock at all -- checked, not assumed: against a lock pinning packaging 21.3,
# `uv pip install "packaging>=21"` resolves 26.3 while `uv sync` gives 21.3.
# So a weekly lock bump would open pull requests that cannot move the jobs
# most likely to break, on a repository where the whole point of the matrix is
# that it floats. Refresh it deliberately with `uv lock --upgrade` instead.
#
# Security alerts still cover these dependencies; they do not need this file.
