version: 2

updates:
  # Actions are pinned by commit in the release and CodeQL workflows, which
  # means nothing about them updates on its own -- a pinned SHA is frozen until
  # someone moves it. This is the thing that moves it, and it rewrites the
  # trailing `# vX.Y.Z` comment along with the SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Ungrouped, deliberately. The first grouped run (PR #10) proposed one
    # major number across three unrelated actions and moved setup-uv from the
    # v9.0.0 pinned in release.yml down to v7.6.0 -- a downgrade, on the
    # workflow that publishes to PyPI, under twelve green checks. One action
    # per pull request makes that visible in the title.
    #
    # One exception, and only where the coupling is the action's own. The
    # codeql-action directories are one action released under one tag: a run
    # whose init and analyze disagree fails in the analyze post-action with
    # "Loaded a configuration file for version X, but running version Y". Split
    # across two pull requests (#52 and #54) neither half could go green, and
    # merging either would have left main in the state that produces that
    # error. The group is the narrowest one that covers it -- the pattern
    # matches nothing but codeql-action, so the visibility the ungrouped
    # default buys for unrelated actions is untouched.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

# No Python entry. Every dependency here is a floor (`matplotlib>=3.8`,
# `pytest>=7.0`) and uv.lock is not committed, so there is nothing for
# Dependabot to raise -- the constraints already admit the newest release.
# Security alerts still cover those dependencies; they do not need this file.
